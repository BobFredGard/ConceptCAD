<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Le repère de la barre du logiciel (.brand .mk) : carré arrondi, moitié gauche bleue, trait central. -->
  <defs>
    <linearGradient id="bleu" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="0.45" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <clipPath id="dedans"><rect x="12" y="12" width="232" height="232" rx="56"/></clipPath>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="#1c1c1e"/>
  <rect x="12" y="12" width="116" height="232" fill="url(#bleu)" clip-path="url(#dedans)"/>
  <rect x="114" y="12" width="28" height="232" fill="#f5f5f7"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="none" stroke="#f5f5f7" stroke-width="24"/>
</svg>
