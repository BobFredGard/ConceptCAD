[package]
name = "conceptcad"
version = "0.65.0"
edition = "2021"
description = "ConceptCAD en application Windows et Mac"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
flate2 = "1"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = true

# compresser le noyau (43 Mo) à la compilation : sans ça, l'outil de compression tourne en lent
[profile.release.build-override]
opt-level = 3
