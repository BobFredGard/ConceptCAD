# Noyau ConceptCAD — opencascade.js 2.0 bêta (image donalffons/opencascade.js:2.0.0-beta.b5ff984,
# OCCT 7.6.x, Emscripten 3.1.14). Rendu par occt-build/build.cjs (le C++ y est injecté).
# `bindings` vide = toutes les classes, comme le moteur actuel (opencascade.js 1.1.1).
# Mêmes conventions d'appel que l'actuel : surcharges suffixées _1, _2…
mainBuild:
  name: conceptcad.js
  bindings: []
  emccFlags:
    - -flto
    - -fexceptions
    - -sDISABLE_EXCEPTION_CATCHING=0
    - -O3
    # script classique (pas de module ES) : se charge comme occt/opencascade.full.js
    - -sMODULARIZE=1
    - -sEXPORT_NAME=opencascade
    - -sEXPORTED_RUNTIME_METHODS=['FS','HEAP8','HEAPU8','HEAP32']
    - -sINITIAL_MEMORY=100MB
    - -sMAXIMUM_MEMORY=4GB
    - -sALLOW_MEMORY_GROWTH=1
    - -sUSE_FREETYPE=1
    - -sLLD_REPORT_UNDEFINED
    - --no-entry
  additionalBindCode: |
    // @EXTRAS@

# Repris du full.yml d'opencascade.js 2.0 : aide au décodage des exceptions OCCT.
additionalCppCode: |
  typedef Handle(IMeshTools_Context) Handle_IMeshTools_Context;
  class OCJS {
  public:
    static Standard_Failure* getStandard_FailureData(intptr_t exceptionPtr) {
      return reinterpret_cast<Standard_Failure*>(exceptionPtr);
    }
  };
