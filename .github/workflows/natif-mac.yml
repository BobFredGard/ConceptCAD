# Fabrique la version native pour Mac (puces Apple et Intel) sur un Mac de GitHub, la lance sur une pièce
# d'exemple et prend des captures. Le DMG et les captures sont à télécharger en bas de la page du passage ;
# rien n'est publié. Les bibliothèques (OCCT, wxWidgets, FreeType) sont compilées une fois puis gardées en cache.

name: Natif Mac

on:
  push:
    branches: ['claude/natif-mac']
    paths:
      - 'natif/**'
      - '.github/workflows/natif-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

# Un passage à la fois : le suivant attend et retrouve les bibliothèques en cache au lieu de les recompiler
concurrency:
  group: natif-mac
  cancel-in-progress: false

jobs:
  dependances:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: natif/.tiers/mac/prefixe
          key: natif-mac-tiers-${{ hashFiles('natif/mac/dependances.sh') }}
      - name: Outils
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja
      - name: Compiler OCCT, wxWidgets et FreeType
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash natif/mac/dependances.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: natif/.tiers/mac/prefixe
          key: natif-mac-tiers-${{ hashFiles('natif/mac/dependances.sh') }}

  application:
    needs: dependances
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: natif/.tiers/mac/prefixe
          key: natif-mac-tiers-${{ hashFiles('natif/mac/dependances.sh') }}
          fail-on-cache-miss: true
      - name: Outils
        run: brew install ninja
      - name: Pièces d'essai
        run: git lfs pull --include "Exemples/003-50-200-O-Drapeau Outillage Complet.conceptcad,Exemples/Cache Piles.conceptcad,Exemples/Barquette.conceptcad"
      - name: Compiler et fabriquer le DMG
        run: bash natif/mac/construire.sh 2>&1 | tee construire.txt; exit ${PIPESTATUS[0]}
      - name: Erreurs de compilation
        if: failure()
        run: grep -E "error:|fatal error" construire.txt | sort | uniq | head -400 || true
      - name: Calcul sans fenêtre (comparé à Windows)
        run: |
          mkdir -p captures
          EXE="natif/sortie-mac/ConceptCAD natif.app/Contents/MacOS/ConceptCADNatif"
          for f in "003-50-200-O-Drapeau Outillage Complet" "Cache Piles" "Barquette"; do
            "$EXE" --verif "Exemples/$f.conceptcad" "captures/verif-$f.json" || echo "code $? pour $f"
            head -c 1500 "captures/verif-$f.json" || true; echo
          done
      - name: Installer et lancer
        shell: bash {0}
        run: |
          # Les bibliothèques de fabrication mises de côté : l'application doit se suffire à elle-même
          mv natif/.tiers/mac/prefixe /tmp/prefixe-de-cote
          hdiutil attach natif/sortie-mac/ConceptCAD-natif-Mac.dmg -mountpoint /tmp/cc-dmg -nobrowse
          cp -R "/tmp/cc-dmg/ConceptCAD natif.app" /Applications/
          hdiutil detach /tmp/cc-dmg
          A="/Applications/ConceptCAD natif.app/Contents/MacOS/ConceptCADNatif"
          "$A" --verif "Exemples/Barquette.conceptcad" captures/verif-installee.json; echo "calcul depuis l'application installée : code $?"
          "$A" > captures/sortie-demarrage.txt 2>&1 &
          sleep 25
          if pgrep -x ConceptCADNatif; then echo "ouverte"; else echo "FERMEE"; fi
          screencapture -x captures/1-demarrage.png
          pkill -x ConceptCADNatif; sleep 3
          "$A" "Exemples/003-50-200-O-Drapeau Outillage Complet.conceptcad" > captures/sortie-drapeau.txt 2>&1 &
          sleep 30
          if pgrep -x ConceptCADNatif; then echo "ouverte"; else echo "FERMEE"; fi
          screencapture -x captures/2-drapeau.png
          pkill -x ConceptCADNatif; sleep 3
          tail -n 40 captures/sortie-*.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null
          cp ~/Library/Logs/DiagnosticReports/ConceptCADNatif* captures/ 2>/dev/null
          for f in captures/ConceptCADNatif*; do [ -f "$f" ] && head -c 6000 "$f"; done
          ls captures
          test -f captures/2-drapeau.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ConceptCAD-natif-Mac-dmg
          path: natif/sortie-mac/ConceptCAD-natif-Mac.dmg
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-natif-mac
          path: |
            captures
            construire.txt
          if-no-files-found: ignore
